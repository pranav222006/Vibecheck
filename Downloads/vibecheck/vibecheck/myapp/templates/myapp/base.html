{% load static %}<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Vibe Check{% endblock %}</title>
<link rel="stylesheet" href="{% static 'myapp/style.css' %}"></head>
<body data-mood="happy">
<canvas id="particles"></canvas>
<header><a class="logo" href="/">🎧 Vibe Check</a>
<nav><a href="/">Home</a><a href="/faqs/">FAQs</a><a href="/errors/">Error Codes</a><a href="/tickets/">Support</a><a href="/health/">Health</a></nav></header>
<main>{% block content %}{% endblock %}</main>
<footer>Vibe Check · Final assessment project</footer>
<button id="chat-toggle" aria-label="Open assistant">💬</button>
<section id="chat" hidden>
 <div class="chat-head">Vibe Assistant <button id="chat-close">✕</button></div>
 <div id="chat-msgs"><div class="bot">Hi! Ask me an FAQ or an error code like 404.</div></div>
 <div class="chat-in"><input id="chat-input" placeholder="Type a question…" maxlength="500"><button id="chat-send">Send</button></div>
</section>
<script src="{% static 'myapp/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body></html>
