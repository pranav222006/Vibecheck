{% extends "myapp/base.html" %}{% block title %}Error Codes{% endblock %}
{% block content %}<h1>Error Codes</h1><div class="grid">
{% for e in codes %}<div class="card"><h3>{{ e.code }} · {{ e.title }}</h3><p>{{ e.explanation }}</p><p><b>Fix:</b> {{ e.fix }}</p></div>{% endfor %}</div>{% endblock %}
